version: '3.8'

services:
  web:
    image: mediacms/mediacms:latest
    ports:
      - "8001:80"
    volumes:
      - ${APP_DATA_DIR}/media_files:/home/mediacms.io/mediacms/media_files
      - ${APP_DATA_DIR}/logs:/home/mediacms.io/mediacms/logs
    environment:
      - DB_HOST=db
      - DB_NAME=mediacms
      - DB_USER=mediacms
      - DB_PASSWORD=mediacms_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADMIN_USER=admin
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin_password
      # Only run web server
      - ENABLE_CELERY_SHORT=no
      - ENABLE_CELERY_LONG=no
      - ENABLE_CELERY_BEAT=no
      - ENABLE_MIGRATIONS=no
    depends_on:
      - db
      - redis
      - migrations
    restart: always

  migrations:
    image: mediacms/mediacms:latest
    command: /home/mediacms.io/mediacms/deploy/docker/prestart.sh
    volumes:
      - ${APP_DATA_DIR}/media_files:/home/mediacms.io/mediacms/media_files
    environment:
      - DB_HOST=db
      - DB_NAME=mediacms
      - DB_USER=mediacms
      - DB_PASSWORD=mediacms_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADMIN_USER=admin
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin_password
      # Disable all long running services
      - ENABLE_UWSGI=no
      - ENABLE_NGINX=no
      - ENABLE_CELERY_SHORT=no
      - ENABLE_CELERY_LONG=no
      - ENABLE_CELERY_BEAT=no
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  celery_worker:
    image: mediacms/mediacms:latest
    volumes:
      - ${APP_DATA_DIR}/media_files:/home/mediacms.io/mediacms/media_files
      - ${APP_DATA_DIR}/logs:/home/mediacms.io/mediacms/logs
    environment:
      - DB_HOST=db
      - DB_NAME=mediacms
      - DB_USER=mediacms
      - DB_PASSWORD=mediacms_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Enable worker
      - ENABLE_UWSGI=no
      - ENABLE_NGINX=no
      - ENABLE_CELERY_BEAT=no
      - ENABLE_MIGRATIONS=no
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=mediacms
      - POSTGRES_PASSWORD=mediacms_password
      - POSTGRES_DB=mediacms
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediacms"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:alpine
    volumes:
      - ${APP_DATA_DIR}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always